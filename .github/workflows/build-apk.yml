name: Build KavirKharid APK

on:
workflow_dispatch:

jobs:
build:
runs-on: ubuntu-24.04

steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Set up Java 17
    uses: actions/setup-java@v5
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

  - name: Extract project ZIP
    run: |
      unzip -o KavirKharid_Android_Project.zip -d .

  - name: Set up Gradle
    uses: gradle/actions/setup-gradle@v4
    with:
      gradle-version: '8.9'

  - name: Build APK
    working-directory: KavirKharid
    run: gradle --no-daemon assembleDebug

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: KavirKharid-debug-apk
      path: KavirKharid/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
